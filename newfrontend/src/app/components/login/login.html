<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light" style="margin-top: -56px; padding-top: 56px; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);">
  <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 400px;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-dark mb-2">Welcome Back</h2>
        <p class="text-muted">Please login to your account</p>
      </div>

      <form (ngSubmit)="login()">
        <div class="form-floating mb-3">
          <input
            type="email"
            class="form-control"
            id="floatingEmail"
            [(ngModel)]="email"
            name="email"
            placeholder="name@example.com"
            required>
          <label for="floatingEmail">Email address</label>
        </div>

        <div class="form-floating mb-4">
          <input
            type="password"
            class="form-control"
            id="floatingPassword"
            [(ngModel)]="password"
            name="password"
            placeholder="Password"
            required>
          <label for="floatingPassword">Password</label>
        </div>

        <button
          type="button"
          class="btn btn-warning btn-lg w-100 fw-bold shadow-sm"
          (click)="login()">
          Login
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="mb-0 text-muted">Don't have an account? <a routerLink="/register" class="text-decoration-none fw-bold text-primary">Register First</a></p>
      </div>
    </div>
  </div>
</div>
