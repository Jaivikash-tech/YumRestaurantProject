<div class="container mt-4">

  <h2>My Cart</h2>

  <table class="table table-bordered">

    <thead>
      <tr>
        <th>Food</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let item of cartItems">

        <td>
          {{item.foodId.name}}
        </td>

        <td>
          ₹{{item.foodId.price}}
        </td>

        <td>

          <button
            class="btn btn-sm btn-danger"
            (click)="decrease(item)">
            -
          </button>

          {{item.quantity}}

          <button
            class="btn btn-sm btn-success"
            (click)="increase(item)">
            +
          </button>

        </td>

        <td>
          ₹{{item.foodId.price * item.quantity}}
        </td>

        <td>

          <button
            class="btn btn-danger"
            (click)="remove(item._id)">
            Remove
          </button>

        </td>

      </tr>

    </tbody>

  </table>

  <h3>
    Total : ₹{{total}}
  </h3>

  <h3>Total : ₹{{total}}</h3>

<a
  routerLink="/address"
  class="btn btn-success">

  Continue To Address

</a>

</div>
