<div class="container mt-4">

  <h2 class="mb-4">{{ currentCategory ? currentCategory + ' Menu' : 'Full Food Menu' }}</h2>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div
      class="col"
      *ngFor="let food of filteredFoods">
      <div class="card h-100 shadow-sm border-0">
        <img *ngIf="food.image" [src]="food.image" class="card-img-top" alt="{{food.name}}" style="height: 200px; object-fit: cover;">
        <div class="card-body d-flex flex-column">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="card-title mb-0 fw-bold">{{food.name}}</h5>
            <span class="badge bg-secondary">{{food.category}}</span>
          </div>
          <p class="card-text text-muted">{{food.description}}</p>
          <div class="mt-auto pt-3 d-flex justify-content-between align-items-center">
            <span class="fs-5 fw-bold text-success">₹{{food.price}}</span>

            <div>
              <button
                class="btn btn-outline-danger btn-sm me-2"
                (click)="addToCart(food._id)">
                Add To Cart
              </button>

              <a
                routerLink="/cart"
                class="btn btn-success btn-sm">
                Cart
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
