<div class="container mt-5">

  <h2>Admin Login</h2>

  <input
    class="form-control mb-2"
    [(ngModel)]="username"
    placeholder="Username">

  <input
    type="password"
    class="form-control mb-2"
    [(ngModel)]="password"
    placeholder="Password">

  <button
    class="btn btn-primary"
    (click)="login()">

    Login

  </button>

</div>
