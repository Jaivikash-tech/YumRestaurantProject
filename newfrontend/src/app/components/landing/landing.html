<div class="landing-hero">
  <div class="overlay">
    <div class="hero-content text-center text-white">
      <h1 class="display-3 fw-bold mb-4">Welcome to Yum Restaurant</h1>
      <p class="lead mb-4">Discover the best food and drinks in town.</p>
      <button (click)="viewCategory(null)" class="btn btn-warning btn-lg px-4 me-md-2 fw-bold">View Full Menu</button>
    </div>
  </div>
</div>

<div class="container my-5">
  <h2 class="text-center mb-4">Our Categories</h2>
  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" *ngFor="let category of categories">
      <div class="card h-100 shadow-sm border-0">
        <img [src]="category.image" class="card-img-top" alt="{{category.name}}" style="height: 200px; object-fit: cover;">
        <div class="card-body d-flex flex-column text-center">
          <h4 class="card-title fw-bold">{{category.name}}</h4>
          <p class="card-text text-muted">{{category.description}}</p>
          <div class="mt-auto pt-3">
            <button (click)="viewCategory(category.name)" class="btn btn-outline-danger w-100 fw-bold">View {{category.name}}</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<hr class="my-5">

<!-- Embedded Full Menu -->
<div id="full-menu-section" class="container mb-5">
  <app-food-list></app-food-list>
</div>
